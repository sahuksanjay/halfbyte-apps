<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-adsense-account" content="ca-pub-6873039572158249">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6873039572158249"
     crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>halfbyte apps</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border: #27272a;
            --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
        }

        .logo-light { color: #f0f0f0; }
        .logo-dark { color: #6366f1; }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover { color: var(--accent); }

        .nav-cta {
            background: var(--gradient);
            color: white;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .mobile-menu {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-primary);
        }

        .hero {
            min-height: 62vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8rem 2rem 4rem;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-content {
            max-width: 900px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .hero-badge {
            display: inline-block;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        .hero h1 span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 650px;
            margin: 0 auto;
        }

        section {
            padding: 5rem 2rem;
        }

        .apps-section {
            background: var(--bg-secondary);
        }

        .section-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 3rem;
        }

        .section-header h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .section-header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        .apps-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
        }

        .app-card {
            display: flex;
            flex-direction: column;
            min-height: 280px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            text-decoration: none;
            color: var(--text-primary);
            transition: transform 0.3s ease, border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .app-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: 0 18px 45px rgba(99, 102, 241, 0.16);
        }

        .app-icon {
            width: 64px;
            height: 64px;
            background: var(--gradient);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.65rem;
            margin-bottom: 1.5rem;
        }

        .app-card h3 {
            font-size: 1.35rem;
            margin-bottom: 0.65rem;
        }

        .app-card p {
            color: var(--text-secondary);
            flex: 1;
        }

        .app-open {
            margin-top: 1.5rem;
            color: var(--accent-hover);
            font-weight: 600;
        }

        .app-open i {
            margin-left: 0.35rem;
            transition: transform 0.2s ease;
        }

        .app-card:hover .app-open i {
            transform: translateX(4px);
        }

        .about {
            background: var(--bg-primary);
        }

        .about-container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .about-container h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .about-container p {
            color: var(--text-secondary);
            max-width: 720px;
            margin: 0 auto;
        }

        .copyright {
            background: var(--bg-primary);
            border-top: 1px solid var(--border);
            padding: 1.5rem 2rem;
            text-align: center;
            color: var(--text-muted);
        }

        @media (max-width: 968px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--bg-secondary);
                flex-direction: column;
                padding: 1rem;
                gap: 1rem;
                border-bottom: 1px solid var(--border);
            }

            .nav-links.mobile-open { display: flex; }
            .nav-cta { display: none; }
            .mobile-menu { display: block; }
        }

        @media (max-width: 640px) {
            .nav-container { padding: 1rem 1.25rem; }
            section { padding: 4rem 1.25rem; }
            .hero { padding: 7rem 1.25rem 3rem; min-height: 55vh; }
            .apps-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a class="logo" href="/">
                <span class="logo-dark">&lt;</span><span class="logo-light">half</span><span class="logo-dark">byte</span><span class="logo-light">&gt;</span>
            </a>

            <ul class="nav-links">
                <!--li><a href="#home">Home</a></li-->
                <li><a href="https://halfbyte.in/#home">Home</a></li>
                <li><a href="#apps">Apps</a></li>
                <li><a href="https://halfbyte.in/#about">About</a></li>
            </ul>

            <a href="https://halfbyte.in" class="nav-cta">halfbyte.in</a>
            <div class="mobile-menu" aria-label="Open menu">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <main>
        <!--
        <section class="hero" id="home">
            <div class="hero-content">
                <div class="hero-badge"><i class="fas fa-layer-group"></i> halfbyte applications</div>
                <h1>Explore <span> apps</span></h1>
                <p>Games, tools, and small applications built and hosted by halfbyte.</p>
            </div>
        </section>
        -->

        <section class="apps-section" id="apps">
            <div class="section-header">
                <h2>Applications</h2>
                <p>Choose an application below to get started.</p>
            </div>

            <div class="apps-grid">
                <!-- Add new applications by copying an .app-card and changing
                     the href, icon, title, and description. -->

                <a class="app-card" href="/dragonTower">
                    <div class="app-icon"><i class="fas fa-dragon"></i></div>
                    <h3>Dragon Tower</h3>
                    <p>Play Dragon Tower and test your skills.</p>
                    <div class="app-open">Open app <i class="fas fa-arrow-right"></i></div>
                </a>
                
                <a class="app-card" href="/qr">
                    <div class="app-icon"><i class="fas fa-qrcode"></i></div>
                    <h3>QR Code Generator</h3>
                    <p>Enter anything and turn it into a QR code.</p>
                    <div class="app-open">Open app <i class="fas fa-arrow-right"></i></div>
                </a>
                

                <!-- Example future application:
                <a class="app-card" href="/xyzgames">
                    <div class="app-icon"><i class="fas fa-gamepad"></i></div>
                    <h3>XYZ Games</h3>
                    <p>A collection of games and challenges.</p>
                    <div class="app-open">Open app <i class="fas fa-arrow-right"></i></div>
                </a>
                -->
            </div>
        </section>

        <!--section class="about" id="about">
            <div class="about-container">
                <h2>About <span class="logo-dark">&lt;</span><span class="logo-light">half</span><span class="logo-dark">byte</span><span class="logo-light">&gt;</span></h2>
                <p>Explore lightweight applications</p>
            </div>
        </section-->
    </main>

    <footer class="copyright">
        <p>&copy; 2026 halfbyte. All rights reserved.</p>
    </footer>

    <script>
        const mobileMenu = document.querySelector('.mobile-menu');
        const navLinks = document.querySelector('.nav-links');

        mobileMenu.addEventListener('click', function () {
            navLinks.classList.toggle('mobile-open');
        });

        window.addEventListener('resize', function () {
            if (window.innerWidth > 968) {
                navLinks.classList.remove('mobile-open');
            }
        });
    </script>
</body>
</html>
